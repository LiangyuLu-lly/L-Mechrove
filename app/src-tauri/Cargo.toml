[workspace]
members = [".", "crates/capabilities", "crates/gcu-mqtt", "crates/hid-kb", "crates/ec-acpi"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "L-Mechrevo"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
capabilities = { path = "crates/capabilities" }
gcu-mqtt = { path = "crates/gcu-mqtt" }
hid-kb = { path = "crates/hid-kb" }
ec-acpi = { path = "crates/ec-acpi" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
