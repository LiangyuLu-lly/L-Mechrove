[package]
name = "hid-kb"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
native-open = []

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
